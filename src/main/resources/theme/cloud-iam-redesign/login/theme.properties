# Inherit everything from the stock Keycloak login theme (PatternFly v4),
# then layer Cloud-IAM-specific styling on top via dist/login.css.
parent=keycloak

# Cloud-IAM branding
kcLogoLink=https://www.cloud-iam.com

# Custom stylesheet (built from resources/scss/login.scss via `npm run build`).
# Listed alongside the default `css/login.css` from the parent theme so both load.
styles=css/login.css dist/login.css

meta=viewport==width=device-width,initial-scale=1
